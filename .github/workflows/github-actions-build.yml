name: GitHub Actions Build
run-name: Building & uploading projects
on: [push]
jobs:
  Build-Solution:
    runs-on: windows-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v3
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v1.1
      - name: Setup Nuget
        uses: Nuget/setup-nuget@v1      
      - name: Setup dotnet
        uses: actions/setup-dotnet@v3
        with:
            dotnet-version: '5.0.x'
      - uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Restore nuget packages
        run: nuget restore MetaTraderApi_2017.sln
      - run: echo "🖥️ The workflow will now start building the MTApiService.dll"
      - name: Build MTApiService for release
        run: msbuild MTApiService\MTApiService.csproj -t:rebuild -verbosity:diag -property:Configuration=Release
      - name: Build MtApi5 for release
        run: dotnet build MtApi5\MtApi5.csproj -c Release
      - name: Build MT5Connector for release
        run: msbuild MT5Connector\MT5Connector.vcxproj -t:rebuild -verbosity:diag -property:Configuration=Release
      - name: PR artifacts
        uses: actions/upload-artifact@v3
        if: github.ref != 'refs/heads/master'
        with:
          name: MetaTraderApi
          retention-days: 5
          path: |
            build\products\Release\MTApiService.dll
            build\products\Release\MtApi5.dll
            build\products\Release\MtApiServiceNetCore.dll
            MT5Connector\build\products\Release\MT5Connector.dll
            MT5Connector\build\products\Release\MT5Connector.lib
            MT5Connector\build\products\Release\MT5Connector.exp
      - name: Latest
        uses: softprops/action-gh-release@v1
        if: github.ref == 'refs/heads/master'
        with:
          tag_name: Latest
          files: |
            build\products\Release\MTApiService.dll
            build\products\Release\MtApi5.dll
            build\products\Release\MtApiServiceNetCore.dll
            MT5Connector\build\products\Release\MT5Connector.dll
            MT5Connector\build\products\Release\MT5Connector.lib
            MT5Connector\build\products\Release\MT5Connector.exp
